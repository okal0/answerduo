<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AnswerDuo · Live interview</title>
<link rel="stylesheet" href="/style.css">
<body class="companion-page">
<header><a class="brand" href="/" aria-label="AnswerDuo home"><i class="logo"><b></b><b></b><b></b><b></b></i>Answer<span>Duo</span></a><span class="pill" id="connection">Connecting…</span></header>
<main class="phone">
  <section class="question-bar" aria-labelledby="question-label">
    <span class="eyebrow" id="question-label">Last question</span>
    <h1 id="last-question">Waiting for a question…</h1>
  </section>
  <div id="transcript" tabindex="0" aria-label="Live interview conversation"></div>
  <p id="notice" role="status"></p>
  <div class="actions">
    <button type="button" id="prompt-toggle" aria-pressed="true" aria-label="Auto-scroll" title="Pause auto-scroll">Ⅱ</button>
    <button class="primary" id="ask" disabled>Get answer</button>
    <button id="analyze" disabled>Analyze screen</button>
  </div>
</main>
<script defer src="/katex.js"></script><script type="module" src="/app.js"></script>
</body></html>
